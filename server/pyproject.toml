[project]
name = "factory-inventory-management"
version = "1.0.0"
description = "Factory Inventory Management System Demo"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.24.0",
    "pydantic>=2.5.0",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 120

[tool.ruff.format]
# Existing code mixes single and double quotes; preserve them to avoid churn
quote-style = "preserve"

[tool.hatch.build.targets.wheel]
packages = ["."]
